[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionlayer-cli"
version = "1.0.0"
description = "CLI for the DecisionLayer arbitration API: file, track, and respond as claimant or respondent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Archwares" }]
keywords = ["decisionlayer", "arbitration", "api", "cli"]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
decisionlayer = "decisionlayer_cli.cli:app"
dl = "decisionlayer_cli.cli:app"

[project.urls]
Homepage = "https://www.decisionlayer.ai/api"
API = "https://www.decisionlayer.ai/api/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"